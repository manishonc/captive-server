# Builds the AP Adoption Helper installers (macOS dmg + Windows exe) and
# attaches them to the GitHub release whenever an ap-adoption-helper-v* tag
# is pushed. Can also be run manually from the Actions tab.
#
# Note: the artifact version comes from ap-adoption-helper/package.json —
# bump it there before tagging a new version.
name: Build AP Adoption Helper installers

on:
  push:
    tags:
      - 'ap-adoption-helper-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ap-adoption-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ap-adoption-helper/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run dist:mac

      - run: npm run dist:win

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            ap-adoption-helper/release/*.dmg
            ap-adoption-helper/release/*.exe

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/*.dmg release/*.exe --clobber ||
          gh release create "${GITHUB_REF_NAME}" release/*.dmg release/*.exe \
            --title "${GITHUB_REF_NAME}" --generate-notes
