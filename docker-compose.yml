services:
  freeradius:
    build: ./freeradius
    container_name: freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    restart: unless-stopped

  portal:
    build: ./portal
    container_name: portal
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-167.71.229.249.nip.io}
    restart: unless-stopped

  server:
    build: ./server
    container_name: server
    ports:
      - "4000:4000"
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    restart: unless-stopped
