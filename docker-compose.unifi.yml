services:
  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${UNIFI_MONGO_ROOT_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${UNIFI_MONGO_ROOT_PASS:-changeme_root}
    volumes:
      - unifi_db_data:/data/db
      - ./unifi/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - coolify
    restart: unless-stopped

  unifi:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi
    depends_on:
      - unifi-db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MONGO_USER=${UNIFI_MONGO_USER:-unifi}
      - MONGO_PASS=${UNIFI_MONGO_PASS:-changeme_unifi}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
    volumes:
      - unifi_config:/config
    ports:
      # AP inform — must be reachable from physical APs (8080 taken by Coolify on host)
      - "8085:8080"
      # STUN (optional but recommended)
      - "3478:3478/udp"
      # 8443 not exposed to host — Traefik reaches it via the coolify network
    networks:
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTPS router — Let's Encrypt cert for unifi.heidifi.ai
      - "traefik.http.routers.unifi.rule=Host(`unifi.heidifi.ai`)"
      - "traefik.http.routers.unifi.entrypoints=https"
      - "traefik.http.routers.unifi.tls=true"
      - "traefik.http.routers.unifi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.unifi.service=unifi-svc"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.unifi-http.rule=Host(`unifi.heidifi.ai`)"
      - "traefik.http.routers.unifi-http.entrypoints=http"
      - "traefik.http.routers.unifi-http.middlewares=redirect-to-https"
      # Backend: UniFi speaks HTTPS with a self-signed cert
      - "traefik.http.services.unifi-svc.loadbalancer.server.port=8443"
      - "traefik.http.services.unifi-svc.loadbalancer.server.scheme=https"
      - "traefik.http.serversTransports.unifi-transport.insecureSkipVerify=true"
      - "traefik.http.services.unifi-svc.loadbalancer.serversTransport=unifi-transport"

volumes:
  unifi_db_data:
  unifi_config:

networks:
  coolify:
    external: true
