<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Point Not Registered</title>
  <style>
    :root { --primary: #1c2b4a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .unregistered-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 32px;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .unregistered-body h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .unregistered-body p {
      font-size: 14px;
      color: #777;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .unregistered-body p:last-of-type {
      margin-bottom: 36px;
    }

    .btn-contact {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .btn-website {
      display: block;
      width: 100%;
      padding: 14px;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .site-footer {
      border-top: 1px solid #f0f0f0;
      padding: 16px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .footer-powered { display: flex; align-items: center; gap: 8px; }
    .footer-powered-text { font-size: 12px; color: #999; font-weight: 500; }
    .footer-powered img { height: 26px; object-fit: contain; vertical-align: middle; }
  </style>
</head>
<body>
<div class="page">

  <div class="unregistered-body">
    <div class="icon-wrap">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e53e3e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <h1>Access Point Not Registered</h1>
    <p>This access point has not been set up on the HeidiFi network.</p>
    <p>Please contact us to get your venue connected.</p>

    <a href="mailto:contact@heidifi.ai" class="btn-contact">contact@heidifi.ai</a>
    <a href="https://heidifi.ai" target="_blank" rel="noopener" class="btn-website">Visit heidifi.ai</a>
  </div>

  <div class="site-footer">
    <div class="footer-powered">
      <span class="footer-powered-text">Powered by</span>
      <img src="/askheidi-logo.png" alt="AskHeidi">
    </div>
  </div>

</div>
</body>
</html>
