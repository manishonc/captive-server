<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
    }
    .checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.4s ease-out;
    }
    .checkmark svg {
      width: 40px;
      height: 40px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    .checkmark svg path {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: draw 0.4s ease-out 0.3s forwards;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      text-decoration: none;
      text-align: center;
    }
    .btn:hover { opacity: 0.9; }
    .hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 16px;
      line-height: 1.4;
    }
    .back-link {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      text-decoration: none;
    }
    .back-link:hover { color: #555; }
  </style>
</head>
<body>
  <div id="previewBanner" style="display:none; position:fixed;top:0;left:0;right:0;z-index:9999;
       background:#f59e0b;color:#000;text-align:center;font-size:12px;font-weight:700;
       padding:6px;letter-spacing:.5px;">
    &#9888; PREVIEW MODE &#8212; no data stored, internet not actually connected
  </div>
  <div class="card">
    <div class="checkmark">
      <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1>You're Connected!</h1>
    <p class="subtitle">You now have internet access.<br>Tap the button to open the site.</p>
    <!-- target="_blank" is key: macOS CNA opens _blank links in the real browser (Safari/Chrome) -->
    <a id="continueBtn" class="btn" href="https://heidifi.ai/" target="_blank">Open heidifi.ai</a>
    <p class="hint">If the button doesn't work, close this window and open your browser.</p>
    <a id="backLink" class="back-link" href="/?preview=1" style="display:none;">&#8592; Back to Portal</a>
  </div>

  <script>
    var isPreview = new URLSearchParams(location.search).get('preview') === '1';

    if (isPreview) {
      document.getElementById('previewBanner').style.display = 'block';
      document.body.style.paddingTop = '30px';
      document.getElementById('backLink').style.display = 'block';
    }

    var TARGET = 'https://heidifi.ai/';
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua);

    if (!isPreview && isIOS) {
      // iOS: auto-trigger — window.open opens Safari outside the CNA sheet
      window.addEventListener('load', function() {
        setTimeout(function() {
          var w = window.open(TARGET, '_blank');
          if (!w) { window.location.href = TARGET; }
          // Poke Apple's detect URL to trigger CNA dismissal
          setTimeout(function() {
            window.location.href = 'http://captive.apple.com/hotspot-detect.html';
          }, 600);
        }, 500);
      });

      // Override button click for iOS too
      document.getElementById('continueBtn').addEventListener('click', function(e) {
        e.preventDefault();
        var w = window.open(TARGET, '_blank');
        if (!w) { window.location.href = TARGET; }
      });
    }
    // macOS/Windows: don't intercept the click — let <a href target="_blank"> work naturally.
    // macOS CNA opens target="_blank" links in the real system browser (Safari/Chrome).
  </script>
</body>
</html>
