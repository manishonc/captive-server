<!--
  TEMPLATE CONTRACT
  =================
  Every restaurant template index.html MUST:
  1. Have a <form> that POSTs to "/submit" with fields: name, email, mac, ip, url, post
  2. Include JS that reads Aruba query params (mac, ip, url, post, apmac) into hidden fields
     using: new URLSearchParams(window.location.search)
  3. The "name" and "email" fields should be visible inputs filled by the guest
  4. The "mac", "ip", "url", "post", "apmac" fields should be hidden inputs populated from query params
     - mac:   guest device MAC (used for identification)
     - apmac: AP/router MAC (used to look up CaptivePortal_AccessPoints in Firestore)

  Static assets for this template live in the same directory and are served at:
    /static/default/  (e.g. /static/default/logo.png)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest WiFi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      text-align: center;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s;
      margin-bottom: 20px;
      -webkit-appearance: none;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      color: #e53e3e;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p class="subtitle">Connect to our guest WiFi</p>
    <form id="portalForm" action="/submit" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required>

      <input type="hidden" id="mac" name="mac">
      <input type="hidden" id="ip" name="ip">
      <input type="hidden" id="url" name="url">
      <input type="hidden" id="post" name="post">
      <input type="hidden" id="apmac" name="apmac">

      <p class="error" id="errorMsg">Please fill in all fields.</p>
      <button type="submit">Connect to Internet</button>
    </form>
  </div>

  <script>
    // Extract Aruba Instant On query params from the URL
    const params = new URLSearchParams(window.location.search);
    document.getElementById('mac').value = params.get('mac') || '';
    document.getElementById('ip').value = params.get('ip') || '';
    document.getElementById('url').value = params.get('url') || '';
    document.getElementById('post').value = params.get('post') || '';
    document.getElementById('apmac').value = params.get('apmac') || '';

    document.getElementById('portalForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      if (!name || !email) {
        document.getElementById('errorMsg').textContent = 'Please fill in all fields.';
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      const btn = this.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Connecting...';
      document.getElementById('errorMsg').style.display = 'none';

      try {
        const res = await fetch('/api/create-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            mac: document.getElementById('mac').value,
            ip: document.getElementById('ip').value,
            url: document.getElementById('url').value,
            post: document.getElementById('post').value,
            apmac: document.getElementById('apmac').value,
          }),
        });
        if (!res.ok) throw new Error('Server error');
        // User created in Firestore — now submit to portal /submit for Aruba auth
        this.submit();
      } catch (err) {
        document.getElementById('errorMsg').textContent = 'Something went wrong. Please try again.';
        document.getElementById('errorMsg').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Connect to Internet';
      }
    });
  </script>
</body>
</html>
