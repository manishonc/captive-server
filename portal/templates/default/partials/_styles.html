  <style>
    :root { --primary: #1c2b4a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .step { display: flex; flex-direction: column; flex: 1; }
    .step.hidden { display: none; }

    /* ── Logo ── */
    .logo-wrap {
      padding: 32px 24px 20px;
      display: flex;
      justify-content: center;
    }
    .logo-wrap img {
      max-height: 100px;
      max-width: 260px;
      object-fit: contain;
    }
    .logo-wrap.compact { padding: 24px 24px 14px; }
    .logo-wrap.compact img { max-height: 72px; }

    /* ── Shared body padding ── */
    .body-pad {
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── Section heading ── */
    .section-heading {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 4px;
    }
    .section-sub {
      font-size: 13px;
      color: #999;
      text-align: center;
      margin-bottom: 24px;
    }

    /* ── Form fields ── */
    .field-group {
      margin-bottom: 16px;
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      font-size: 16px;
      color: #222;
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    /* ── Phone ── */
    .phone-wrap {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .country-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 11px;
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      background: #fafafa;
      cursor: pointer;
      white-space: nowrap;
      min-width: 84px;
      transition: border-color 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .country-btn:hover, .country-btn.open { border-color: #667eea; }
    #selectedFlag { font-size: 19px; line-height: 1; }
    #selectedCode { font-weight: 700; color: #444; font-size: 13px; }
    .caret { font-size: 8px; color: #bbb; }
    .phone-wrap input[type="tel"] { flex: 1; }

    .country-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 300;
      background: #fff;
      border: 1.5px solid #e8e8e8;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.13);
      width: 256px;
      max-height: 260px;
      flex-direction: column;
    }
    .country-dropdown.open { display: flex; }
    .country-search {
      padding: 10px 12px;
      border: none;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      outline: none;
      border-radius: 12px 12px 0 0;
    }
    .country-list { overflow-y: auto; flex: 1; }
    .country-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }
    .country-option:hover { background: #f5f3ff; }
    .opt-flag { font-size: 18px; width: 22px; text-align: center; }
    .opt-name { flex: 1; }
    .opt-code { color: #aaa; font-size: 12px; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: color-mix(in srgb, var(--primary) 80%, black); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-text {
      width: 100%;
      padding: 11px;
      background: none;
      border: none;
      font-size: 14px;
      color: #666;
      text-align: center;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-text:hover { color: #222; }

    .error-msg {
      font-size: 13px;
      color: #e53e3e;
      margin-bottom: 10px;
      display: none;
    }

    /* ── Consent box ── */
    .consent-heading {
      font-size: 24px;
      font-weight: 400;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .consent-sub {
      font-size: 14px;
      color: #777;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.55;
    }
    .consent-box {
      background: #f0eeee;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      font-size: 14px;
      color: #555;
      line-height: 1.7;
      text-align: center;
      flex: 1;
    }
    .consent-box p + p { margin-top: 14px; }

    /* ── Shared footer — always visible on both steps ── */
    .site-footer {
      border-top: 1px solid #f0f0f0;
      padding: 16px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .footer-privacy {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      line-height: 1.8;
    }
    .footer-privacy a { color: var(--primary); text-decoration: none; cursor: pointer; }
    .footer-privacy a:hover { text-decoration: underline; }

    .footer-powered {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-powered-text {
      font-size: 12px;
      color: #999;
      font-weight: 500;
    }
    .footer-powered img {
      height: 26px;
      object-fit: contain;
      vertical-align: middle;
    }

    /* ── Modal ── */
    #ppModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.48);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #ppModal.open { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-hdr {
      padding: 18px 20px 14px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-hdr h2 { font-size: 17px; font-weight: 700; color: #222; }
    .modal-close-x {
      background: none; border: none;
      font-size: 24px; color: #bbb; cursor: pointer; line-height: 1; padding: 0 2px;
    }
    .modal-close-x:hover { color: #555; }
    #ppContent {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
      font-size: 14px;
      color: #444;
      line-height: 1.75;
      white-space: pre-wrap;
    }
    .modal-ftr {
      padding: 14px 20px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }
    .modal-ftr button {
      padding: 9px 22px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
